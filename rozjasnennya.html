<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Роз'яснення НСЗУ — розділ переїхав</title>
  <link rel="canonical" href="rozjasnennya/index.html">
  <!-- Стара сторінка-список замінена розділом rozjasnennya/ (26.07.2026):
       паспорти документів, текст до окремого речення, таблиці додатків,
       коди зі зв'язком у класифікатори, граф «скасовує / доповнює».
       Редирект лишається, щоб працювали закладки й старі посилання,
       зокрема ?q= і ?package= з інших розділів порталу. -->
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var target = new URLSearchParams();
      // старий ?q= — це пошуковий запит, у новому розділі параметр той самий
      if (params.get('q')) target.set('q', params.get('q'));
      if (params.get('package')) target.set('package', params.get('package'));
      var query = target.toString();
      location.replace('rozjasnennya/index.html' + (query ? '?' + query : ''));
    })();
  </script>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
           margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: #f5f8fb; color: #1e2f42; padding: 24px; }
    .card { background: #fff; border: 1px solid #e3e8ef; border-radius: 14px;
            padding: 28px 32px; max-width: 520px; text-align: center; }
    h1 { font-size: 20px; margin: 0 0 10px; }
    p { line-height: 1.6; color: #4a5d73; margin: 0 0 18px; }
    a { display: inline-block; background: #2f6b9e; color: #fff; text-decoration: none;
        padding: 10px 18px; border-radius: 10px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Розділ «Роз'яснення» переїхав</h1>
    <p>Тепер кожен лист має паспорт, повний текст із посиланням на окреме
       речення, таблиці додатків і зв'язки з іншими роз'ясненнями.</p>
    <a href="rozjasnennya/index.html">Перейти до роз'яснень</a>
  </div>
</body>
</html>

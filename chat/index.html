<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Чат департаменту | НавігаторПМГ26</title>
  <meta name="robots" content="noindex">
  <!-- Старий «Робочий чат» з 03.11.2026 замінено «Чатом департаменту» (zviazok/):
       ті самі кімнати й уся історія, плюс голос. Тут лишилося тільки перенаправлення —
       для закладок, установленого застосунку і плаваючого вікна (?mode=popup). -->
  <meta http-equiv="refresh" content="0; url=../zviazok/index.html">
  <script>
    (function () {
      var qs = new URLSearchParams(location.search);
      var to = '../zviazok/index.html' + (qs.get('mode') === 'popup' ? '?mode=popup' : '');
      // Старий чат мав власний service worker зі scope /chat/ — знімаємо його
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { if (/\/chat\/$/.test(r.scope)) r.unregister(); });
        }).catch(function () {});
      }
      location.replace(to);
    })();
  </script>
  <style>body{font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:90vh;color:#1f3347;background:#f5fafb}a{color:#2f6b9e}</style>
</head>
<body>
  <p>Чат переїхав: <a href="../zviazok/index.html">Чат департаменту</a> — текст і голос.</p>
</body>
</html>
